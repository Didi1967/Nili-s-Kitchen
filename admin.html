  <style>
  
  html,
body {
  min-height: 100%;
  height: auto;
  overflow-y: auto;
}

body {
  overflow-x: hidden;
}

.creator-page,
.admin-page,
.admin-container {
  min-height: 100vh;
  height: auto;

#adminRecipes {
  height: auto;
  overflow: visible;

    body {
      margin: 0;
      background: #f4efe7;
      font-family: Arial, sans-serif;
      color: #07172d;
    }
    
    .admin-wrap {
      max-width: 1200px;

      display: flex;
      justify-content: space-between;

    }

    .admin-card-body {

    }

    .admin-card h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .admin-meta {
      font-size: 14px;
      color: #4e5c70;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .admin-section {
      margin-top: 14px;
    }

    .admin-section h3 {
      font-size: 15px;
      margin: 0 0 6px;
      color: #0d3b28;
    }

    .admin-section p {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.5;
      color: #172033;
      font-size: 14px;
    }

    .admin-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .admin-actions button {
      border: none;
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .approve-btn {
      background: #157347;
      color: white;
    }

    .reject-btn {
      background: #b02a37;
      color: white;
    }

    .delete-btn {
      background: #edf0f4;
      color: #111827;
    }

    .empty {
      background: white;
      border-radius: 20px;
      padding: 24px;
      border: 1px solid #eadcc7;
    }

    .edit-btn {
  background: #0d6efd;
  color: white;
}

.edit-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: rgba(0,0,0,0.45);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.edit-modal-box {
  width: min(760px, 96vw);
  max-height: 90vh;
  overflow-y: auto;
  background: #fffaf3;
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);

.edit-modal-box h2 {
  margin-top: 0;
}

.edit-modal-box label {
  display: block;

.edit-modal-box input,
.edit-modal-box textarea {

  min-height: 110px;
  resize: vertical;
}

.edit-actions {
  display: flex;

  margin-top: 18px;

<body class="content-page-body">
  <div class="admin-wrap">
    <div class="admin-header">
      <div>
        <h1>Admin Recipe Review</h1>
        <p>Bekleyen tarifler Türkçe olarak burada görünür.</p>
      </div>

      <a href="/" style="font-weight:700;color:#07172d;text-decoration:none;">
        Back to app
      </a>
    </div>

    <div id="adminRecipes" class="admin-grid"></div>
  </div>

  <script>
  
  const API_BASE = "https://api.niliskitchen.com";

let adminRecipesCache = [];

    async function loadAdminRecipes() {
  const container = document.getElementById("adminRecipes");

  container.innerHTML = "<div class='empty'>Tarifler yükleniyor...</div>";

  try {
    const res = await fetch(`${API_BASE}/admin/pending-recipes`);
    const data = await res.json();

    if (!data.success || !data.recipes || !data.recipes.length) {
      container.innerHTML = "<div class='empty'>Şu anda bekleyen tarif yok.</div>";
      return;
    }

    adminRecipesCache = data.recipes;

    container.innerHTML = data.recipes.map(recipe => {
      const isVideo = recipe.mediaType && recipe.mediaType.startsWith("video");

      const mediaUrl = recipe.mediaUrl && recipe.mediaUrl.startsWith("http")
        ? recipe.mediaUrl
        : `${API_BASE}${recipe.mediaUrl || ""}`;

      const mediaHtml = isVideo
        ? `<video class="admin-card-media" controls src="${mediaUrl}"></video>`
        : `<img class="admin-card-media" src="${mediaUrl}" alt="${recipe.title || ""}">`;

      return `
        <div class="admin-card">
          ${mediaHtml}

          <div class="admin-card-body">
            <h2>${recipe.title || "-"}</h2>

            <div class="admin-meta">
              <strong>Gönderen:</strong> ${recipe.creatorUsername || "-"}<br>
              <strong>Email:</strong> ${recipe.creatorEmail || "-"}<br>
              <strong>Süre:</strong> ${recipe.prepTime || "-"}<br>
              <strong>Porsiyon:</strong> ${recipe.servings || "-"}<br>
              <strong>Durum:</strong> ${recipe.status || "-"}
            </div>

            <div class="admin-section">
              <h3>Malzemeler</h3>
              <p>${recipe.ingredients || "-"}</p>
            </div>

            <div class="admin-section">
              <h3>Yapılış</h3>
              <p>${recipe.instructions || "-"}</p>
            </div>

            <div class="admin-actions">
              <button class="edit-btn" onclick="openEditRecipe('${recipe.id}')">Düzenle</button>
              <button class="approve-btn" onclick="approveRecipe('${recipe.id}')">Yayınla</button>
              <button class="reject-btn" onclick="rejectRecipe('${recipe.id}')">Reddet</button>
              <button class="delete-btn" onclick="deleteRecipe('${recipe.id}')">Arşivle</button>
            </div>
          </div>
        </div>
      `;
    }).join("");

  } catch (err) {
    console.error("ADMIN LOAD ERROR:", err);
    container.innerHTML = "<div class='empty'>Admin tarifleri yüklenemedi.</div>";
  }
}
   async function approveRecipe(id) {
  if (!confirm("Bu tarifi onaylamak istiyor musun?")) return;

  const res = await fetch(`${API_BASE}/admin/approve-recipe/${id}`, {
    method: "POST"
  });

  const data = await res.json();

  console.log("APPROVE RESPONSE:", data);

  loadAdminRecipes();
}

async function rejectRecipe(id) {
  if (!confirm("Bu tarifi reddetmek istiyor musun?")) return;

  await fetch(`${API_BASE}/admin/reject-recipe/${id}`, {
    method: "POST"
  });

  loadAdminRecipes();
}

async function deleteRecipe(id) {
  if (!confirm("Bu tarifi silmek istiyor musun?")) return;

  await fetch(`${API_BASE}/admin/delete-recipe/${id}`, {
    method: "POST"
  });

  loadAdminRecipes();
}

loadAdminRecipes();


    function openEditRecipe(id) {
  const recipe =
  adminRecipesCache.find(item =>
    item.id === id
  );

  if (!recipe) {
    alert("Recipe bulunamadı.");
    return;
  }

  document.getElementById("editRecipeId").value = recipe.id;

  document.getElementById("editTitle").value =
  recipe.title || "";

  document.getElementById("editAdminTitleTr").value =
  recipe.adminTitleTr || recipe.title || "";

  document.getElementById("editIngredients").value =
  recipe.ingredients || "";

  document.getElementById("editAdminIngredientsTr").value =
  recipe.adminIngredientsTr || recipe.ingredients || "";

  document.getElementById("editInstructions").value =
  recipe.instructions || "";

  document.getElementById("editAdminInstructionsTr").value =
  recipe.adminInstructionsTr || recipe.instructions || "";

  document.getElementById("editPrepTime").value =
  recipe.prepTime || "";

  document.getElementById("editServings").value =
  recipe.servings || "";

  document.getElementById("editMedia").value = "";

  document.getElementById("editRecipeModal").style.display = "flex";
}

function closeEditRecipe() {
  document.getElementById("editRecipeModal").style.display = "none";
}

async function saveEditRecipe() {
  const id =
  document.getElementById("editRecipeId").value;

  const formData =
  new FormData();

  formData.append(
    "title",
    document.getElementById("editTitle").value.trim()
  );

  formData.append(
    "adminTitleTr",
    document.getElementById("editAdminTitleTr").value.trim()
  );

  formData.append(
    "ingredients",
    document.getElementById("editIngredients").value.trim()
  );

  formData.append(
    "adminIngredientsTr",
    document.getElementById("editAdminIngredientsTr").value.trim()
  );

  formData.append(
    "instructions",
    document.getElementById("editInstructions").value.trim()
  );

  formData.append(
    "adminInstructionsTr",
    document.getElementById("editAdminInstructionsTr").value.trim()
  );

  formData.append(
    "prepTime",
    document.getElementById("editPrepTime").value.trim()
  );

  formData.append(
    "servings",
    document.getElementById("editServings").value.trim()
  );

  const mediaInput =
  document.getElementById("editMedia");

  if (mediaInput.files && mediaInput.files[0]) {
    formData.append("media", mediaInput.files[0]);
  }

  const res =
  await fetch(`${API_BASE}/admin/update-recipe/` + id, {
    method: "POST",
    body: formData
  });

  const data =
  await res.json();

  if (!data.success) {
    alert(data.error || "Güncelleme başarısız.");
    return;
  }

  closeEditRecipe();
  await loadAdminRecipes();

  alert("Recipe güncellendi.");
}
  </script>

<div id="editRecipeModal" class="edit-modal">
  <div class="edit-modal-box">
    <h2>Recipe Düzenle</h2>

    <input type="hidden" id="editRecipeId">

    <label>Tarif Adı</label>
    <input id="editTitle" type="text">

    <label>Admin Türkçe Başlık</label>
    <input id="editAdminTitleTr" type="text">

    <label>Malzemeler</label>
    <textarea id="editIngredients"></textarea>

    <label>Admin Türkçe Malzemeler</label>
    <textarea id="editAdminIngredientsTr"></textarea>

    <label>Yapılış</label>
    <textarea id="editInstructions"></textarea>

    <label>Admin Türkçe Yapılış</label>
    <textarea id="editAdminInstructionsTr"></textarea>

    <label>Süre</label>
    <input id="editPrepTime" type="text">

    <label>Porsiyon</label>
    <input id="editServings" type="text">

    <label>Fotoğraf / Video değiştir</label>
    <input id="editMedia" type="file" accept="image/*,video/*">

    <div class="edit-actions">
      <button onclick="saveEditRecipe()" class="approve-btn">
        Kaydet
      </button>

      <button onclick="closeEditRecipe()" class="delete-btn">
        Vazgeç
      </button>
    </div>
  </div>
</div>
