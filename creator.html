  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Your Recipe | Nili's Kitchen</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      background:#f8f1e7;
      font-family:Arial, sans-serif;
      color:#182234;
      padding:32px;
    }

    .creator-page{
      max-width:820px;
      margin:0 auto;
      background:white;
      border-radius:30px;
      padding:34px;
      box-shadow:0 28px 80px rgba(0,0,0,.12);
      border:1px solid #eadfce;
    }

    .top{
      display:flex;
      justify-content:space-between;
      gap:20px;
      align-items:flex-start;
      margin-bottom:28px;
    }

    .top h1{
      font-size:36px;
      line-height:1;
      letter-spacing:-1.2px;
      margin-bottom:10px;
    }

    .top p{
      color:#6b7280;
      font-size:15px;
      line-height:1.5;
      max-width:560px;
    }

    .back{
      text-decoration:none;
      background:#f3f4f6;
      color:#374151;
      padding:12px 16px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
    }

    .creator-info{
      background:#fffaf3;
      border:1px solid #eadfce;
      border-radius:20px;
      padding:16px;
      margin-bottom:22px;
      color:#374151;
      font-size:14px;
      font-weight:800;
    }

    .creator-form{
      display:grid;
      gap:16px;
    }

    .creator-form label{
      display:grid;
      gap:8px;
      font-size:13px;
      font-weight:900;
      color:#182234;
    }

    .creator-form input,
    .creator-form textarea{
      width:100%;
      border:1px solid #eadfce;
      border-radius:16px;
      padding:14px;
      font-size:14px;
      outline:none;
      font-family:inherit;
      background:#fffaf3;
      color:#182234;
      font-weight:700;
    }

    .creator-form textarea{
      min-height:120px;
      resize:vertical;
      line-height:1.5;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .creator-actions{
      display:flex;
      gap:12px;
      margin-top:10px;
    }

    .creator-submit{
      height:52px;
      border:none;
      border-radius:18px;
      padding:0 24px;
      background:linear-gradient(135deg,#ef6a1a,#d94d0a);
      color:white;
      font-size:15px;
      font-weight:950;
      cursor:pointer;
    }

    .creator-reset{
      height:52px;
      border:none;
      border-radius:18px;
      padding:0 22px;
      background:#f3f4f6;
      color:#374151;
      font-size:15px;
      font-weight:900;
      cursor:pointer;
    }

    #creatorMessage{
      margin-top:18px;
      font-weight:900;
    }

    @media(max-width:700px){
      body{
        padding:18px;
      }

      .creator-page{
        padding:22px;
        border-radius:24px;
      }

      .top{
        flex-direction:column;
      }

      .row{
        grid-template-columns:1fr;
      }

      .top h1{
        font-size:30px;
      }
    }
  </style>
</head>

<body>

    <div>
      <h1 data-i18n="shareTitle">Share your recipe</h1>

        approved recipes may appear in Nili’s Kitchen with your name.

    </div>

    <input type="hidden" name="creatorEmail" id="creatorEmailHidden">

    <label>
      <span data-i18n="recipeTitle">Recipe title</span>

        data-i18n-placeholder="recipeTitlePlaceholder"
        placeholder="Example: Maria-style chicken rice"
        required
      >
    </label>

    <div class="row">
      <label>
        <span data-i18n="prepTime">Prep time</span>

          name="prepTime"
          data-i18n-placeholder="prepTimePlaceholder"

          placeholder="Example: 4"

    </div>

    <label>
      <span data-i18n="ingredients">Ingredients</span>
      <textarea
        name="ingredients"
        data-i18n-placeholder="ingredientsPlaceholder"
        placeholder="Write ingredients, one per line or separated by commas"
        required
      ></textarea>
    </label>

    <label>
      <span data-i18n="instructions">Instructions</span>
      <textarea
        name="instructions"
        data-i18n-placeholder="instructionsPlaceholder"
        placeholder="Write how to prepare this recipe"

    </label>

    Choose File
  </label>

  <span class="selected-file-name" data-i18n="noFileSelected">
    No file selected
  </span>

  <input
    id="recipeMediaInput"
    name="media"
    type="file"
    accept="image/*,video/*"
    required
    hidden
  >

    </label>

    <div class="creator-actions">
      <button class="creator-submit" type="submit" data-i18n="submitReview">
        Submit for Review
      </button>

      <button class="creator-reset" type="reset" data-i18n="clear">
        Clear
      </button>
    </div>

  </form>

function ct(key){
  return creatorTranslations[currentLang]?.[key] ||
         creatorTranslations.en?.[key] ||
         key;
}

function applyCreatorLanguage(){
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    el.textContent = ct(key);
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    el.placeholder = ct(key);
  });
}

function setText(id, text){
  const el = document.getElementById(id);
  if(el) el.textContent = text;
}

function setPlaceholder(id, text){
  const el = document.getElementById(id);
  if(el) el.placeholder = text;
}

    const creatorForm =
    document.getElementById("creatorForm");

    const creatorMessage =
    document.getElementById("creatorMessage");

    const creatorInfo =
    document.getElementById("creatorInfo");

    const username =
    localStorage.getItem("creatorUsername") || "";

    const emailOrUser =
    localStorage.getItem("creatorEmailOrUser") || "";

    const mode =
    localStorage.getItem("creatorMode") || "signup";

    document.getElementById("creatorUsernameHidden").value =
    username;

    document.getElementById("creatorEmailHidden").value =
    emailOrUser;

    creatorInfo.textContent =
  mode === "login"
    ? ct("loggedInAs") + " " + emailOrUser
    : ct("creator") + ": " + username + " • " + emailOrUser;


    applyCreatorLanguage();  

    const recipeMediaInput =
  document.getElementById("recipeMediaInput");

const selectedFileName =
  document.getElementById("selectedFileName");

if(recipeMediaInput && selectedFileName){

  recipeMediaInput.addEventListener("change", () => {

    if(recipeMediaInput.files.length){
      selectedFileName.textContent =
        recipeMediaInput.files[0].name;
    }else{
      selectedFileName.textContent =
        ct("noFileSelected");
    }

  });

}

    creatorForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      creatorMessage.textContent = ct("submitting");
      creatorMessage.style.color = "#6b7280";

      const formData =
      new FormData(creatorForm);

      try{

  const res = await fetch(`${API_BASE}/submit-recipe`, {
  method: "POST",
  body: formData
});

const raw = await res.text();

let data = {};
try {
  data = JSON.parse(raw);
} catch (e) {
  console.log("SUBMIT RAW RESPONSE:", raw);
  throw new Error("Server JSON dönmedi. Status: " + res.status);
}

if (!res.ok) {
  creatorMessage.textContent =
    data.error || "Submit failed.";

  creatorMessage.style.color =
    "#c2410c";

  return;
}

        creatorMessage.textContent =
        ct("submitted")

        creatorMessage.style.color =
        "#315c45";

        creatorForm.reset();

      }catch(err){

        creatorMessage.textContent =
        ct("submitFailed")

        creatorMessage.style.color =
        "#c2410c";

      }

    });
