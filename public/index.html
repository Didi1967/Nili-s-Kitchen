<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Nili's Kitchen AI
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>

<body>

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <!-- TOP -->

    <div class="sidebar-top">

      <img
        src="logo.jpeg"
        class="logo"
      >

      <h1>
        Nili's Kitchen
      </h1>

      <p
        class="subtitle"
        id="appSubtitle"
      >
        AI Recipe Assistant
      </p>

      <!-- LANGUAGE -->

      <select id="langSelect">

        <option value="en">
          English
        </option>

        <option value="tr">
          Türkçe
        </option>

        <option value="ru">
          Русский
        </option>

        <option value="ar">
          العربية
        </option>

        <option value="es">
          Español
        </option>

        <option value="pt">
          Português
        </option>

        <option value="fr">
          Français
        </option>

      </select>

      <!-- UPLOAD -->

      <div
        class="upload"
        onclick="photo.click()"
      >

        <h3 id="uploadTitle">
          📸 Upload Ingredients
        </h3>

        <p id="statusText">
          Upload ingredients photo
        </p>

        <div class="progress">

          <div
            class="bar"
            id="bar"
          ></div>

        </div>

      </div>

      <input
        type="file"
        id="photo"
        hidden
        accept="image/*"
      >

      <!-- MANUAL -->

      <div class="manual-box">

        <h3
          class="section-title"
          id="manualTitle"
        >
          ✍ Manual Ingredient
        </h3>

        <div class="manual">

          <input
            id="manualInput"
            placeholder="Add ingredient"
          >

          <button onclick="addManual()">
            +
          </button>

        </div>

      </div>

      <!-- CATEGORY -->

      <div class="category-box">

        <h3
          class="section-title"
          id="categoriesTitle"
        >
          🥦 Categories
        </h3>

        <div class="category-grid">

          <button
  id="catVegetables"
  data-category="vegetables"
>
  Vegetables
</button>

<button
  id="catMeat"
  data-category="meat"
>
  Meat
</button>

<button
  id="catSeafood"
  data-category="seafood"
>
  Seafood
</button>

<button
  id="catVegan"
  data-category="vegan"
>
  Vegan
</button>

<button
  id="catPasta"
  data-category="pasta"
>
  Pasta
</button>

<button
  id="catDessert"
  data-category="dessert"
>
  Dessert
</button>
        </div>

      </div>

    </div>

    <div
  class="subcategories"
  id="subcategories"
></div>

    <!-- CHECKLIST -->

    <div class="checklist">

      <h3
  class="section-title"
  id="selectedTitle"
>
  ✅ Selected Ingredients
</h3>

      <div
        class="check-grid"
        id="checklist"
      ></div>

    </div>

    <!-- BOTTOM -->

    <div class="sidebar-bottom">

      <label class="confirm">

        <input
          type="checkbox"
          id="confirmCheck"
        >

        <span id="confirmText">
          Confirm ingredients
        </span>

      </label>

      <button
        class="recipeBtn"
        id="recipeBtn"
      >
        Get Recipes
      </button>

    </div>

  </aside>

  <!-- CONTENT -->

  <main
    class="content"
    id="content"
  >

    <!-- HERO -->

<div
  class="hero"
  id="mosaic"
>

  <div class="hero-left">

    <img
      src="/images/YEMEK-2.jpeg"
      alt="Food"
    >

  </div>

  <div class="hero-right">

    <img
      src="/images/YEMEK-1.jpeg"
      alt="Food"
    >

    <img
      src="/images/YEMEK-3.jpeg"
      alt="Food"
    >

  </div>

</div>

    <!-- RESULT -->

    <div
      class="grid"
      id="result"
    ></div>

  </main>

  <!-- MODAL -->

  <div
    class="modal"
    id="modal"
  >

    <div class="modal-content">

      <div
        class="close"
        onclick="closeModal()"
      >
        ×
      </div>

      <div id="modalBody"></div>

    </div>

  </div>

  <script src="/app.js"></script>

</body>
</html>
