<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nili's Kitchen AI</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <aside id="sidebar">

    <div class="sidebar-top">

      <img src="logo.jpeg" class="logo">

      <h1>Nili's Kitchen</h1>

      <p class="subtitle" id="appSubtitle">
        AI Recipe Assistant
      </p>

      <select id="langSelect">
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
      </select>

      <div class="upload" onclick="photo.click()">
        <h3 id="uploadTitle">📸 Upload Ingredients</h3>
        <p id="statusText">Upload ingredients photo</p>

        <div class="analyze-progress">
          <div id="bar"></div>
        </div>
      </div>

      <input type="file" id="photo" hidden accept="image/*">

      <div class="manual-box">
        <h3 class="section-title" id="manualTitle">
          ✍ Manual Ingredient
        </h3>

        <div class="manual">
          <input id="manualInput" placeholder="Add ingredient">

          <button type="button" onclick="addManual()">
            +
          </button>
        </div>
      </div>

      <div id="checklist"></div>

      <div class="category-box">

        <div
          class="section-title category-toggle"
          onclick="toggleCategories()"
        >
          <span>🥦 Categories</span>
          <span id="categoryArrow">▼</span>
        </div>

        <div
          class="category-grid collapsed"
          id="categoryGrid"
        >

          <button class="category-btn" id="catVegetables" data-category="vegetables">
            Vegetables
          </button>

          <button class="category-btn" id="catMeat" data-category="meat">
            Meat
          </button>

          <button class="category-btn" id="catSeafood" data-category="seafood">
            Seafood
          </button>

          <button class="category-btn" id="catVegan" data-category="vegan">
            Vegan
          </button>

          <button class="category-btn" id="catPasta" data-category="pasta">
            Pasta
          </button>

          <button class="category-btn" id="catDessert" data-category="dessert">
            Dessert
          </button>

          <button class="category-btn" data-category="fruits">
            Fruits
          </button>

          <button class="category-btn" data-category="dairy">
            Dairy
          </button>

          <button class="category-btn" data-category="grains">
            Grains
          </button>

          <button class="category-btn" data-category="legumes">
            Legumes
          </button>

          <button class="category-btn" data-category="spices">
            Spices
          </button>

          <button class="category-btn" data-category="oils">
            Oils
          </button>

          <button class="category-btn" data-category="sauces">
            Sauces
          </button>

        </div>

      </div>

    </div>

    <div class="sidebar-bottom">

      <label class="confirm">
        <input type="checkbox" id="confirmCheck">

        <span id="confirmText">
          Confirm ingredients
        </span>
      </label>

      <button class="recipeBtn" id="recipeBtn">
        Get Recipes
      </button>

    </div>

  </aside>

  <div id="ingredientModal" class="ingredient-modal">
    <div class="ingredient-modal-content">

      <button
        class="ingredient-modal-close"
        onclick="closeIngredientModal()"
      >
        ×
      </button>

      <h2 id="ingredientModalTitle">
        Ingredients
      </h2>

      <div id="ingredientModalItems"></div>

    </div>
  </div>

  <main class="content" id="content">

    <section class="hero" id="hero">

      <div class="hero-bg">

        <div class="hero-main-card">

          <img src="/YEMEK-1.jpeg" class="hero-main-img">

          <div class="hero-dark"></div>

          <div class="hero-content">

            <span class="hero-badge">
              AI Powered Real Recipes
            </span>

            <h2>
              Cook smarter with what you already have
            </h2>

            <p>
              Upload ingredients, select what you have, and discover real recipes instantly.
            </p>

          </div>

        </div>

        <div class="hero-side-images">
          <img src="/YEMEK-3.jpeg">
          <img src="/YEMEK-5.jpeg">
        </div>

      </div>

    </section>

    <div class="grid" id="result"></div>

  </main>

  <div class="modal" id="modal">

    <div class="modal-content">

      <div class="close" onclick="closeModal()">
        ×
      </div>

      <div id="modalBody"></div>

    </div>

  </div>

  <script src="app.js" defer></script>

</body>
</html>
