<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Nili's Kitchen AI
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body>

  <!-- SIDEBAR -->

 <aside id="sidebar">

  <!-- TOP -->

  <div class="sidebar-top">

    <img
      src="logo.jpeg"
      class="logo"
    >

    <h1>
      Nili's Kitchen
    </h1>

    <p class="subtitle">
      AI Recipe Assistant
    </p>

    <!-- LANGUAGE -->

    <select id="langSelect">

      <option value="en">
        English
      </option>

      <option value="tr">
        Türkçe
      </option>

    </select>

    <!-- UPLOAD -->

    <div
      class="upload"
      onclick="photo.click()"
    >

      <h3 id="uploadTitle">
  📸 Upload Ingredients
</h3>

      <p id="statusText">
  Upload ingredients photo
</p>

    </div>

    <input
      type="file"
      id="photo"
      hidden
      accept="image/*"
    >

    <!-- MANUAL -->

    <div class="manual-box">

      <h3
  class="section-title"
  id="manualTitle"
>
  ✍ Manual Ingredient
</h3>

      <div class="manual">

        <input
          id="manualInput"
          placeholder="Add ingredient"
        >

        <button onclick="addManual()">
          +
        </button>

      </div>

    </div>

    <!-- CATEGORY -->

    <div class="category-box">

      <h3 class="section-title">
        🥦 Categories
      </h3>

      <div class="category-grid">

        <button
  class="category-btn"
  id="catVegetables"
  data-category="vegetables"
>
  Vegetables
</button>

<button
  class="category-btn"
  id="catMeat"
  data-category="meat"
>
  Meat
</button>

<button
  class="category-btn"
  id="catSeafood"
  data-category="seafood"
>
  Seafood
</button>

<button
  class="category-btn"
  id="catVegan"
  data-category="vegan"
>
  Vegan
</button>

<button
  class="category-btn"
  id="catPasta"
  data-category="pasta"
>
  Pasta
</button>

<button
  class="category-btn"
  id="catDessert"
  data-category="dessert"
>
  Dessert
</button>
      </div>

    </div>

    <!-- SUB -->

    <div
      class="subcategories"
      id="subcategories"
    ></div>

  </div>

  <!-- CHECKLIST -->

  <div class="checklist">

   <h3
  class="section-title"
  id="selectedTitle"
>
  ✅ Selected Ingredients
</h3>

    <div
      class="check-grid"
      id="checklist"
    ></div>

  </div>

  <!-- BOTTOM -->

  <div class="sidebar-bottom">

    <label class="confirm">

      <input
        type="checkbox"
        id="confirmCheck"
      >

      <span id="confirmText">
  Confirm ingredients
</span>

    </label>

    <button
      class="recipeBtn"
      id="recipeBtn"
    >
      Get Recipes
    </button>

  </div>

</aside>

  <!-- CONTENT -->

  <main
    class="content"
    id="content"
  >

    <!-- HERO -->

<div class="hero"> 

  <div class="hero-big"> 

    <img src="/images/YEMEK-3.jpeg"> 

  </div> 

  <div class="hero-grid"> 

    <img src="/images/YEMEK-2.jpeg"> 
    <img src="/images/YEMEK-1.jpeg"> 
    <img src="/images/YEMEK-7.jpeg"> 
    <img src="/images/YEMEK-4.jpeg"> 

  </div> 
  
</div>


    <!-- RESULT -->

    <div
      class="grid"
      id="result"
    ></div>

  </main>

  <!-- MODAL -->

  <div
    class="modal"
    id="modal"
  >

    <div class="modal-content">

      <div
        class="close"
        onclick="closeModal()"
      >
        ×
      </div>

      <div id="modalBody"></div>

    </div>

  </div>

<div id="ingredientDrawer">

  <div class="drawer-content">

    <div class="drawer-top">

      <h2 id="drawerTitle">
        Ingredients
      </h2>

      <button id="closeDrawer">
        ✕
      </button>

    </div>

    <div id="drawerItems"></div>

  </div>

</div>

<script src="app.js" defer></script>

</body>


</html>
